spring:
  application:
    name: kafka-mcp
  main:
    banner-mode: off
  jmx:
    enabled: false
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  level:
    root: INFO
    org.apache.kafka: WARN
    io.modelcontextprotocol: WARN
    org.springframework.boot.web.embedded.tomcat: WARN
    org.apache.catalina: WARN
