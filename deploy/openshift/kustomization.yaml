apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The ConfigMap "kafka-mcp-config" (kafka-mcp.yaml + krb5.conf) and the Secret "kafka-mcp-keytab" are not
# generated from this directory; they are environment-specific and created with `oc create configmap/secret` (README).
# Templates: kafka-mcp.yaml.example, krb5.conf.example
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
labels:
  - pairs:
      app.kubernetes.io/name: kafka-mcp
      app.kubernetes.io/component: mcp-server
    includeSelectors: false
images:
  - name: kafka-mcp
    newName: image-registry.openshift-image-registry.svc:5000/<namespace>/kafka-mcp
    newTag: latest
