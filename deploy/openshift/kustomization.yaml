apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ConfigMap "kafka-mcp-config" (kafka-mcp.yaml + krb5.conf) ve Secret "kafka-mcp-keytab" bu dizinden
# üretilmez; ortama özgü olduklarından `oc create configmap/secret` ile oluşturulur (README).
# Şablonlar: kafka-mcp.yaml.example, krb5.conf.example
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
labels:
  - pairs:
      app.kubernetes.io/name: kafka-mcp
      app.kubernetes.io/component: mcp-server
    includeSelectors: false
images:
  - name: kafka-mcp
    newName: image-registry.openshift-image-registry.svc:5000/<namespace>/kafka-mcp
    newTag: latest
